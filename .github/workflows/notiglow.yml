name: NotiGlow CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test NotiGlow
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust Worker Tests
        run: cargo test --manifest-path native/NotiGlow.Background/Cargo.toml

      - name: Build Rust Background Worker (Release)
        run: cargo build --release --manifest-path native/NotiGlow.Background/Cargo.toml

      - name: Verify Rust Worker Binary
        shell: pwsh
        run: |
          $worker = "native/NotiGlow.Background/target/release/NotiGlow_Background.exe"
          if (-not (Test-Path $worker)) {
            Write-Error "Rust worker binary missing at $worker"
            exit 1
          }
          Write-Host "Verified Rust worker binary: $worker"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: |
          dotnet restore NotiGlow.csproj
          dotnet restore NotiGlow.Tests/NotiGlow.Tests.csproj

      - name: Build NotiGlow (Release)
        run: dotnet build NotiGlow.csproj -c Release --no-restore

      - name: Run Unit Tests
        run: dotnet test NotiGlow.Tests/NotiGlow.Tests.csproj -c Release --no-restore --verbosity normal
