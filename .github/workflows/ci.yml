name: CI

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Build & Validate Curry
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tauri/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri

      - name: Install npm dependencies
        working-directory: tauri
        run: npm ci

      - name: TypeScript & Svelte type check
        working-directory: tauri
        run: npm run check

      - name: Build frontend
        working-directory: tauri
        run: npm run build

      - name: Cargo check
        working-directory: tauri/src-tauri
        run: cargo check

      - name: Cargo test
        working-directory: tauri/src-tauri
        run: cargo test
