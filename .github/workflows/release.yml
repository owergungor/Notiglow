name: Release Automation

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: |
          dotnet restore NotiGlow.csproj
          dotnet restore NotiGlow.Tests/NotiGlow.Tests.csproj

      - name: Run Unit Tests
        run: dotnet test NotiGlow.Tests/NotiGlow.Tests.csproj -c Release --no-restore

      - name: Publish NotiGlow (win-x64)
        run: dotnet publish NotiGlow.csproj -c Release -r win-x64 --self-contained false -o ./publish

      - name: Validate Tag Format & Publish Output
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+') {
            Write-Error "Invalid tag format '$tag'. Expected semantic version tag like v1.1.0."
            exit 1
          }
          if (-not (Test-Path "./publish/NotiGlow.exe")) {
            Write-Error "Published executable ./publish/NotiGlow.exe was not found."
            exit 1
          }
          Write-Host "Tag $tag validated and publish output confirmed."

      - name: Create Release Archive & Checksum
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $cleanVersion = $tag.TrimStart('v')
          $zipName = "NotiGlow_${cleanVersion}_win-x64.zip"

          Compress-Archive -Path ./publish/* -DestinationPath $zipName -Force
          if (-not (Test-Path $zipName)) {
            Write-Error "Failed to produce release archive $zipName."
            exit 1
          }
          $hash = (Get-FileHash -Path $zipName -Algorithm SHA256).Hash
          "$hash  $zipName" | Out-File -FilePath "SHA256.txt" -Encoding utf8

          Write-Host "Created $zipName with SHA256: $hash"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            NotiGlow_*_win-x64.zip
            SHA256.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
