name: Release Automation

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and publish'
        required: true
        default: 'v5.1'
        type: string

permissions:
  contents: write

jobs:
  publish-release:
    name: Build & Publish Release
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust Worker Tests
        run: cargo test --manifest-path native/NotiGlow.Background/Cargo.toml

      - name: Build Rust Background Worker (Release)
        run: cargo build --release --manifest-path native/NotiGlow.Background/Cargo.toml

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: |
          dotnet restore NotiGlow.csproj
          dotnet restore NotiGlow.Tests/NotiGlow.Tests.csproj

      - name: Run Unit Tests
        run: dotnet test NotiGlow.Tests/NotiGlow.Tests.csproj -c Release --no-restore

      - name: Publish NotiGlow (win-x64 Self-Contained)
        run: dotnet publish NotiGlow.csproj -c Release -r win-x64 --self-contained true

      - name: Validate Tag Format & Publish Output
        shell: pwsh
        run: |
          $tag = "$env:RELEASE_TAG"
          if ($tag -notmatch '^v[0-9]+\.[0-9]+$') {
            Write-Error "Invalid tag format '$tag'. Expected version tag like v5.1."
            exit 1
          }
          $publishDir = "bin/Release/net9.0-windows10.0.19041.0/win-x64/publish"
          $publishExe = "$publishDir/NotiGlow.exe"
          $publishWorker = "$publishDir/NotiGlow_Background.exe"
          if (-not (Test-Path $publishExe)) {
            Write-Error "Published executable $publishExe was not found."
            exit 1
          }
          if (-not (Test-Path $publishWorker)) {
            Write-Error "Published Rust worker $publishWorker was not found."
            exit 1
          }
          Write-Host "Tag $tag validated and publish output (UI + Rust worker) confirmed."

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          $isccPath = & where.exe iscc 2>$null
          if (-not $isccPath) {
            $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          if (Test-Path $isccPath) {
            Write-Host "Compiling Inno Setup installer using $isccPath..."
            & $isccPath NotiGlow-Setup.iss
          } else {
            Write-Warning "Inno Setup compiler (ISCC.exe) not found; skipping installer compilation."
          }

      - name: Create Release Archive & Checksum
        shell: pwsh
        run: |
          $tag = "$env:RELEASE_TAG"
          $cleanVersion = $tag.TrimStart('v')
          $zipName = "NotiGlow_${cleanVersion}_win-x64.zip"
          $publishDir = "bin/Release/net9.0-windows10.0.19041.0/win-x64/publish"

          if (-not (Test-Path "release")) { New-Item -ItemType Directory -Path "release" -Force }
          $zipPath = "release/$zipName"
          Compress-Archive -Path "$publishDir/*" -DestinationPath $zipPath -Force
          if (-not (Test-Path $zipPath)) {
            Write-Error "Failed to produce release archive $zipPath."
            exit 1
          }
          $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash
          $shaLines = @("$hash  $zipName")

          $installerCandidates = @(
            "release/v$cleanVersion/NotiGlow-Setup-v$cleanVersion.exe",
            "release/NotiGlow-Setup-v$cleanVersion.exe"
          )
          $installerPath = $installerCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($installerPath) {
            $destInstaller = "release/NotiGlow-Setup-v$cleanVersion.exe"
            if ($installerPath -ne $destInstaller) {
              Copy-Item -Path $installerPath -Destination $destInstaller -Force
            }
            $installerHash = (Get-FileHash -Path $destInstaller -Algorithm SHA256).Hash
            $shaLines += "$installerHash  NotiGlow-Setup-v$cleanVersion.exe"
          }

          $shaLines | Out-File -FilePath "release/SHA256.txt" -Encoding utf8
          Write-Host "Created release checksums in release/SHA256.txt"

      - name: Check Existing Release Metadata
        shell: pwsh
        run: |
          $tag = "$env:RELEASE_TAG"
          $repo = "${{ github.repository }}"
          $token = "${{ secrets.GITHUB_TOKEN }}"
          $headers = @{
            "Authorization" = "token $token"
            "Accept" = "application/vnd.github.v3+json"
            "User-Agent" = "NotiGlow-Release-Automation"
          }
          try {
            $existing = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/tags/$tag" -Headers $headers -Method Get
            Write-Host "Found existing release for $tag (ID: $($existing.id)). Preserving release body."
            if ($existing.body) {
              $existing.body | Out-File -FilePath "release_body.md" -Encoding utf8
              "HAS_EXISTING_BODY=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          } catch {
            Write-Host "No existing release found for $tag; release notes will be generated automatically."
          }

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: NotiGlow ${{ env.RELEASE_TAG }}
          body_path: ${{ env.HAS_EXISTING_BODY == 'true' && 'release_body.md' || '' }}
          generate_release_notes: ${{ env.HAS_EXISTING_BODY != 'true' }}
          files: |
            release/NotiGlow_*_win-x64.zip
            release/NotiGlow-Setup-v*.exe
            release/SHA256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
